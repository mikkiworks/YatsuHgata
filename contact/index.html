<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>お問い合わせ｜谷津干潟ナビ</title>

	<!-- ファビコン -->
	<link rel="icon" type="image/png" href="../assets/images/favicon.png" />

	<!-- Google Fonts プリコネクト（通信の事前接続） -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<!-- Google Fonts & Icons 一括読み込み（main.cssより前に配置） -->
	<link href="https://fonts.googleapis.com/css2?family=Hannari&family=Noto+Serif+JP:wght@400;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

	<!-- メインCSS（最後に読み込むことでフォントが確実に適用される） -->
	<link rel="stylesheet" href="../assets/css/style.css">
	<link rel="stylesheet" href="../assets/css/responsive.css">
	
	<!-- 外部JS -->
	<script src="../assets/js/main.js" defer></script>
</head>

<body>

<div class="wrapper">

	<!-- サイドバー全体 -->
	<header class="sidebar">
		
		<!-- SP用ハンバーガーボタン -->
		<button type="button" class="sidebar__toggle" id="js-toggle" aria-label="メニューを開閉する">
			<span></span>
			<span></span>
			<span></span>
		</button>

		<!-- ロゴ -->
		<div>
			<a href="../index.html" class="sidebar__logo">
				<img class="logo__item" src="../assets/images/logo.png" alt="谷津干潟ナビのロゴ">
			</a>
		</div>

		<!-- グローバルナビ -->
		<nav class="gnavi dotted-line-btm">
		
			<!-- SP用満干時間 -->
			<div class="tidearea sp">
				<strong class="tidearea__title">今日(10月16日)の干潮時間</strong>
				<span class="tidearea__time">満潮　01:39／15:19</span>
				<span class="tidearea__time">干潮　08:19／21:00</span>
			</div>
			
			<a href="../news/index.html" class="gnavi__item">
				<span class="gnavi__item__eng">NEWS</span>
				最新情報
			</a>
			<a href="index.html" class="gnavi__item active">
				<span class="gnavi__item__eng">ABOUT</span>
				谷津干潟とは
			</a>
			<a href="../guide/index.html" class="gnavi__item">
				<span class="gnavi__item__eng">GUIDE</span>
				観察・散策ガイド
			</a>
			<a href="../access/index.html" class="gnavi__item">
				<span class="gnavi__item__eng">ACCESS</span>
				アクセス
			</a>
			<a href="../contact/index.html" class="gnavi__item">
				<span class="gnavi__item__eng">CONTACT</span>
				お問い合わせ
			</a>
		</nav>
	</header>

	<div class="main-container">
		
		<!-- コンテンツ -->
		<main class="main">

			<!-- メイン部分 -->
			<div class="upage">
				<h1 class="upage__title">
					<span class="upage__title-eng">Contact</span>
					お問い合わせ
				</h1>
				
				<!-- 本文 -->
				<form class="formbox">
					<p class="catch">どんな些細なことでもお気軽にお問い合わせください！</p>
					<label class="form__item">
						<strong>企業名・組織名</strong>
                		<input type="text" name="organization" autocomplete="organization">
            		</label>
					<label class="form__item">
						<strong class="form__item-name">お名前 <span>*</span></strong>
                		<input type="text" name="name" autocomplete="name">
            		</label>
					<label class="form__item">
						<strong class="form__item-name">Email <span>*</span></strong>
						<input type="email" name="email" autocomplete="email">
					</label>
					<label class="form__item">
						<strong class="form__item-name">URL・SNS</strong>
						<input type="text" name="url" autocomplete="url">
					</label>
					<label class="form__item">
                		<strong class="form__item-name">ご意見・お問い合わせ内容 <span>*</span></strong>
                		<textarea name="message" rows="5" placeholder="ご自由にご記入ください"></textarea>
					</label>
					<div class="form-submit">
						<button type="submit" class="c-button">送信する</button>
					</div>
				</form>
			</div>
		</main>
	
		<footer class="footer">
			<a href="/" class="footer__logo">
				<img src="../assets/images/logo.png" alt="谷津干潟ナビのロゴ">
			</a>
			<ul class="footer__list">
				<li class="footer_list-item"><a href="../about/master.html">管理人について</a></li>
				<li class="footer_list-item"><a href="../partner/index.html">地域のお店・事業者の方へ</a></li>
				<li class="footer_list-item"><a href="../privacy/index.html">プライバシーポリシー</a></li>
				<li class="footer_list-item"><a href="../contact/index.html">お問い合わせ</a></li>
			</ul>
			<p class="footer__copy">Copyright  &copy; YATUHIGATA NAVI.  All rights reserved.</p>
		</footer>

	</div>
</div>

</body>
</html>
